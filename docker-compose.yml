services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pharmasathi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PHARMASATHI_DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      PHARMASATHI_DB_USERNAME: ${POSTGRES_USER}
      PHARMASATHI_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PHARMASATHI_DB_DRIVER: org.postgresql.Driver
      PHARMASATHI_BIND_ADDRESS: 0.0.0.0
      PHARMASATHI_OWNER_KEY: ${PHARMASATHI_OWNER_KEY}
      PHARMASATHI_ALLOWED_ORIGINS: ${PHARMASATHI_ALLOWED_ORIGINS}
      PHARMASATHI_SESSION_HOURS: ${PHARMASATHI_SESSION_HOURS:-24}
      PHARMASATHI_SECURE_COOKIES: "true"
    ports:
      - "8765:8765"

volumes:
  pharmasathi-db:
