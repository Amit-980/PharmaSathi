spring.application.name=backend

spring.datasource.url=${PHARMASATHI_DB_URL:jdbc:h2:file:${user.home}/.pharmasathi/data/pharmasathi}
spring.datasource.username=${PHARMASATHI_DB_USERNAME:sa}
spring.datasource.password=${PHARMASATHI_DB_PASSWORD:}
spring.datasource.driver-class-name=${PHARMASATHI_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=${PHARMASATHI_PORT:8765}
server.address=${PHARMASATHI_BIND_ADDRESS:127.0.0.1}
spring.web.resources.static-locations=classpath:/static/
server.forward-headers-strategy=framework
server.error.include-message=never
server.servlet.session.cookie.secure=${PHARMASATHI_SECURE_COOKIES:false}

pharmasathi.owner-key=${PHARMASATHI_OWNER_KEY:}
pharmasathi.allowed-origins=${PHARMASATHI_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
pharmasathi.session-hours=${PHARMASATHI_SESSION_HOURS:24}
